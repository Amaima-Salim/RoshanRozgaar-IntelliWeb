services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rr
      POSTGRES_PASSWORD: rr
      POSTGRES_DB: roshan
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rr -d roshan"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
